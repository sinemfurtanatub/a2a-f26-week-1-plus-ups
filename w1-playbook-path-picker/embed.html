:root{--stone:#FDFFF2;--evergreen:#23392F;--forest:#192520;--highlight:#F0FE91;--sage:#9EAF9F;
--serif:"Season Mix",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--stone);font-family:var(--sans)}
body{display:grid;place-items:center}
.stage{container-type:inline-size;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:#FDFFF2;overflow:hidden}
.fr{--u:1.13cqw;width:100%;height:100%;padding:calc(2*var(--u));display:flex;flex-direction:column;gap:calc(1.5*var(--u))}
button{font-family:var(--sans);cursor:pointer}
.tb{display:grid;gap:calc(.8*var(--u));flex:none}
.pill,.tb button{height:calc(3.5*var(--u));border-radius:999px;border:1px solid rgba(35,57,47,.22);background:#fff;color:#23392F;font:400 max(10.5px,1.6cqw) var(--sans);padding:0 calc(1.5*var(--u));white-space:nowrap;overflow:hidden;text-overflow:clip}
.pill[aria-pressed=true],.tb button[aria-selected=true]{background:#23392F;border-color:#23392F;color:#FDFFF2;font-weight:600}
.pill.ghost{background:transparent}
.card{background:#fff;border:1px solid rgba(35,57,47,.12);border-radius:2cqw;box-shadow:0 2px 8px rgba(35,57,47,.06);min-width:0;min-height:0}
.mid{flex:1;min-height:0;display:grid;gap:calc(1.5*var(--u))}
.lf{padding:calc(1.7*var(--u)) calc(2.1*var(--u));display:flex;flex-direction:column;min-width:0;min-height:0}
.nm{font:400 4.2cqw/1.05 var(--serif);letter-spacing:-.02em;color:#23392F}
.vd{font:italic 400 max(14px,2.5cqw)/1.2 var(--serif);color:#192520;margin-top:calc(.7*var(--u))}
.vd span{background:linear-gradient(transparent 52%,#F0FE91 52%);padding:0 2px}
.h{font:400 max(13px,2.1cqw)/1.1 var(--serif);color:#23392F}
.b{font:300 max(11px,1.7cqw)/1.35 var(--sans);color:#2E3B34;margin-top:.4cqw}
.sm{font:300 max(10px,1.4cqw)/1.3 var(--sans);color:#66756C}
.t{background:#fff;border:1px solid rgba(35,57,47,.12);border-radius:1.6cqw;padding:calc(1.2*var(--u)) calc(1.8*var(--u));box-shadow:0 2px 8px rgba(35,57,47,.06);display:flex;flex-direction:column;gap:.5cqw;min-height:0;min-width:0;overflow:hidden;justify-content:center}
.g{display:inline-grid;place-items:center;width:max(13px,2.1cqw);height:max(13px,2.1cqw);border-radius:50%;font:500 max(9px,1.3cqw) var(--sans);flex:none;background:#23392F;color:#FDFFF2}
.wa{flex:none;background:#23392F;border-radius:1.7cqw;padding:calc(1.2*var(--u)) calc(2*var(--u));display:flex;gap:calc(1.8*var(--u));align-items:center;color:#FDFFF2;font:300 max(11px,1.7cqw)/1.35 var(--sans)}
.wa b{font:400 max(13px,2.1cqw) var(--serif);color:#F0FE91;flex:none}
.ft{flex:none;display:flex;justify-content:space-between;align-items:center;height:calc(1.8*var(--u))}
.credit{font:300 max(9px,1cqw) var(--sans);color:#66756C;white-space:nowrap}
.logo{width:24cqw;height:auto;display:block}
button:focus-visible,input:focus-visible{outline:.3cqw solid var(--evergreen);outline-offset:.25cqw}
.pill,.tb button{transition:background-color .15s ease,color .15s ease}
@media (prefers-reduced-motion:reduce){.pill,.tb button,*{transition:none!important}}

.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:calc(2*var(--u));min-height:calc(3.5*var(--u))}
.tag{font:400 max(12px,2.2cqw)/1.1 var(--serif);color:#23392F;white-space:nowrap;overflow:hidden}
.tag i{display:inline-block;width:max(9px,1.5cqw);height:max(9px,1.5cqw);border-radius:50%;margin-right:.8cqw;vertical-align:middle;border:1px solid #9EAF9F}
.acts{display:flex;gap:calc(.8*var(--u));flex:none}
.pn{flex:1;min-height:0;padding:calc(1.6*var(--u)) calc(2*var(--u));display:flex;gap:calc(2*var(--u))}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.4*var(--u));text-align:center}
.chip{display:inline-flex;align-items:center;gap:.8cqw;padding:calc(.7*var(--u)) calc(1.6*var(--u));border-radius:1.2cqw;background:#E6ECE3;font:300 max(11px,1.6cqw) var(--sans);color:#2E3B34}
.chip b{font:400 max(12px,1.9cqw) var(--serif);color:#23392F}
.down{color:#66756C;font:400 max(11px,1.8cqw) var(--sans);line-height:1}
.bigq{font:400 max(16px,3.6cqw)/1.1 var(--serif);letter-spacing:-.02em;color:#23392F}
.ans{display:flex;gap:calc(1.4*var(--u))}
.ans button{min-width:calc(11*var(--u));height:calc(4.4*var(--u));border-radius:999px;border:1.5px solid #23392F;background:#fff;color:#23392F;font:500 max(12px,1.9cqw) var(--sans)}
.ans button:hover{background:#23392F;color:#FDFFF2}
.ans .sm{display:block;margin-top:.3cqw}
.trail{flex:none;width:36%;display:flex;flex-direction:column;justify-content:center}
.tl{position:relative;display:flex;flex-direction:column;gap:calc(.55*var(--u))}
.tl::before{content:"";position:absolute;left:calc(1*var(--u) + max(4px,.6cqw));top:calc(.45*var(--u) + max(4px,.6cqw));bottom:calc(.45*var(--u) + max(4px,.6cqw));width:1.5px;background:#9EAF9F}
.tc{position:relative;display:flex;align-items:center;gap:.9cqw;padding:calc(.45*var(--u)) calc(1*var(--u));border-radius:1cqw;font:400 max(10px,1.45cqw)/1.15 var(--sans);color:#2E3B34;opacity:.75;min-width:0}
.tc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .d{flex:none;width:max(8px,1.2cqw);height:max(8px,1.2cqw);border-radius:50%;border:1.5px solid #23392F;background:#FDFFF2}
.tc.cur{opacity:1;font-weight:600;color:#192520}
.tc.k-a .d{background:#E6ECE3}.tc.k-b .d{background:#23392F}.tc.k-c .d{background:#fff}.tc.k-g .d{background:#F0FE91}
.tc.cur{background:rgba(158,175,159,.25)}
.now{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(.8*var(--u))}
.cnt{font:400 max(10px,1.45cqw) var(--sans);color:#66756C}
.st{border-radius:1.8cqw;padding:calc(1.6*var(--u)) calc(2*var(--u));display:flex;flex-direction:column;gap:calc(.7*var(--u));min-height:0;overflow:hidden;border:1.5px solid #23392F;background:#fff}
.st.k-a{background:#E6ECE3;border-color:#9EAF9F}
.st.k-b{background:#23392F;border-color:#23392F}
.st.k-b .nm,.st.k-b .b{color:#FDFFF2}
.st.k-g{background:#F0FE91;border-color:#F0FE91}
.st .nm{font-size:max(15px,3.2cqw)}
.st .b{margin:0}
.st ul{list-style:none;display:grid;grid-template-columns:1fr;gap:calc(.4*var(--u)) calc(1.6*var(--u))}
.st li{font:300 max(10.5px,1.55cqw)/1.25 var(--sans);color:#2E3B34;padding-left:1.4cqw;position:relative}
.st li::before{content:"";position:absolute;left:0;top:.55em;width:.6cqw;height:.6cqw;border-radius:50%;background:#23392F}
.nav{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:calc(1*var(--u));min-height:calc(4*var(--u))}
.nav .hint{margin-right:auto}
.pill.go{background:#23392F;border-color:#23392F;color:#FDFFF2;font-weight:600;height:calc(4*var(--u));padding:0 calc(2.2*var(--u))}
.hide{display:none!important}
@container (max-width:560px){
.fr{padding:calc(1.5*var(--u)) calc(2*var(--u));gap:calc(1*var(--u))}
.pill{height:calc(4.6*var(--u));font-size:max(10.5px,2.7cqw);padding:0 calc(1.4*var(--u))}
.pill.go{height:calc(5*var(--u))}
.tag{font-size:max(11px,3cqw)}
.pn{padding:calc(1*var(--u)) calc(1.4*var(--u))}
.trail,.cnt,.st .b,.st ul,.chip,.down,.ans .sm,.ft,.nav .hint{display:none!important}
.bigq{font-size:max(13px,4.4cqw)}
.ans button{height:calc(6*var(--u));font-size:max(11px,3cqw)}
.st{padding:calc(1*var(--u)) calc(1.6*var(--u))}
.st .nm{font-size:max(13px,4.4cqw)}
}
</style></head>
<body>
<div class="stage"><main class="fr" aria-label="Playbook path picker">
<div class="top"><div class="tag" id="tag"></div>
<div class="acts"><button class="pill ghost" id="back" type="button">Back</button><button class="pill ghost" id="reset" type="button">Start over</button></div></div>

  Array.prototype.forEach.call(panel.querySelectorAll("[data-a]"),function(b){b.onclick=function(){path=b.getAttribute("data-a");i=0;render()}});
  return;
 }
 var S=steps(),s=S[i],last=i===S.length-1;
 $("tag").innerHTML='<i style="background:'+(path==="no"?"#E6ECE3":"#23392F")+'"></i>'+P[path].tag;
 $("back").classList.remove("hide");$("reset").classList.remove("hide");$("nav").classList.remove("hide");
 $("next").classList.toggle("hide",last);
 $("hint").textContent=i===P[path].steps.length-1?"Next, both paths meet.":(last?"":"");
 var trail=S.slice(0,i+1).map(function(t,n){return '<div class="tc k-'+t[3]+(n===i?' cur':'')+'"><b class="d"></b><span>'+t[0]+'</span></div>'}).join("");
 var body=s[2]?'<ul>'+s[2].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>':'<div class="b">'+s[1]+'</div>';
 panel.innerHTML='<div class="trail" aria-label="Steps so far"><div class="tl">'+trail+'</div></div>'+
  '<div class="now"><div class="cnt">Step '+(i+1)+' of '+S.length+'</div><div class="st k-'+s[3]+'"><div class="nm">'+s[0]+'</div>'+body+'</div></div>';
}
$("next").onclick=function(){i++;render()};
$("back").onclick=function(){if(i>0)i--;else path=null;render()};
$("reset").onclick=function(){path=null;i=0;render()};
render();

</script>
</body></html>
